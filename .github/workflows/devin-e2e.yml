name: Devin contracts and client regressions

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'backend/**'
      - 'deploy/devin-e2e.sh'
      - 'deploy/docker-compose.devin-e2e.yml'
      - 'deploy/devin-agent-e2e.sh'
      - 'deploy/devin-long-e2e.sh'
      - 'tools/devin-e2e-clients/**'
      - 'tools/devin-acceptance/**'
      - 'deploy/devin-user-journeys.sh'
      - 'frontend/src/components/keys/**'
      - 'frontend/src/utils/devinClientConfig.ts'
      - 'frontend/src/i18n/**'
      - 'frontend/test-support/**'
      - '.github/workflows/devin-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'backend/**'
      - 'deploy/devin-e2e.sh'
      - 'deploy/docker-compose.devin-e2e.yml'
      - 'deploy/devin-agent-e2e.sh'
      - 'deploy/devin-long-e2e.sh'
      - 'tools/devin-e2e-clients/**'
      - 'tools/devin-acceptance/**'
      - 'deploy/devin-user-journeys.sh'
      - 'frontend/src/components/keys/**'
      - 'frontend/src/utils/devinClientConfig.ts'
      - 'frontend/src/i18n/**'
      - 'frontend/test-support/**'
      - '.github/workflows/devin-e2e.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Plan onboards the PAT without inference; live consumes test-account credits.'
        type: choice
        options: [mock, plan, live]
        default: mock
      allow_paid:
        description: 'Authorize selected batch: protocol 6; agent canary at most 3; agent matrix at most 48 gateway requests. No provider spending cap.'
        type: boolean
        default: false
      suite:
        description: 'Protocol/client contracts only; neither suite certifies product user E2E'
        type: choice
        options: [protocol, agents]
        default: protocol
      agent_batch:
        description: 'Canary: one OMP direct read; matrix: 42 client launches, both model kinds'
        type: choice
        options: [canary, matrix]
        default: canary

permissions:
  contents: read

jobs:
  mock:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mock'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Exercise the production gateway with synthetic Devin RPCs
        env:
          DEVIN_E2E_ARTIFACTS: ${{ runner.temp }}/devin-e2e
        run: make test-devin-contracts-mock
      - name: Exercise long Fusion tools, compaction and restart with synthetic RPCs
        env:
          DEVIN_E2E_ARTIFACTS: ${{ runner.temp }}/devin-long
        run: make test-devin-fusion-contracts-mock
      - name: Save test results (exclude private backend log and binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devin-e2e-mock
          path: |
            ${{ runner.temp }}/devin-e2e/results.jsonl
            ${{ runner.temp }}/devin-e2e/provenance.txt
            ${{ runner.temp }}/devin-e2e/smoke-plan.json
            ${{ runner.temp }}/devin-long/results.jsonl
            ${{ runner.temp }}/devin-long/provenance.txt
            ${{ runner.temp }}/devin-long/long-workflow.json
            ${{ runner.temp }}/devin-long/long-context.json
          if-no-files-found: ignore
          retention-days: 7

  clients-mock:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mock'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/devin-e2e-clients/package-lock.json
      - name: Install locked Linux clients without lifecycle scripts
        run: npm ci --prefix tools/devin-e2e-clients --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Check runner boundaries
        run: python3 -m unittest discover -s tools/devin-e2e-clients -p 'test_*.py'
      - name: Real clients through current gateway and synthetic Devin
        env:
          DEVIN_E2E_ARTIFACTS: ${{ runner.temp }}/devin-agents
        run: make test-devin-client-contracts-mock
      - name: Save structural client and role evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devin-agent-mock
          path: |
            ${{ runner.temp }}/devin-agents/results.jsonl
            ${{ runner.temp }}/devin-agents/provenance.txt
            ${{ runner.temp }}/devin-agents/agent-*.json
            ${{ runner.temp }}/devin-agents/fusion-*.json
          if-no-files-found: ignore
          retention-days: 7

  user-journeys-mock:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mock'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned clients and production UI dependencies
        run: |
          npm ci --prefix tools/devin-e2e-clients --ignore-scripts --omit=optional --no-audit --no-fund
          pnpm --dir frontend install --frozen-lockfile
      - name: Validate acceptance negative cases and runner boundaries
        run: |
          make test-devin-acceptance
          python3 -m unittest discover -s tools/devin-e2e-clients -p 'test_*.py'
      - name: Product copy buttons to actual CLI project journeys with synthetic models
        env:
          DEVIN_E2E_ARTIFACTS: ${{ runner.temp }}/devin-user-journeys
          DEVIN_JOURNEY_CAPABILITIES: 'true'
        run: make test-devin-user-journeys-mock
      - name: Validate source-bound mock evidence (never release-eligible)
        env:
          REPORT: ${{ runner.temp }}/devin-user-journeys/client-journeys.json
        run: python3 tools/devin-acceptance/acceptance.py verify --mode client_mock --report "$REPORT" --commit "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD^{tree})"
      - name: Check complete exact-SHA GitHub read snapshot (not acceptance)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_HEAD: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_BASE: ${{ github.event.pull_request.base.sha }}
          SNAPSHOT_PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,subprocess
          from pathlib import Path
          head,base=os.environ['SNAPSHOT_HEAD'],os.environ['SNAPSHOT_BASE']
          digest=hashlib.sha256(subprocess.check_output(['git','diff','--binary','--full-index',base,head])).hexdigest()
          (Path(os.environ['RUNNER_TEMP']) / 'pending-review.json').write_text(json.dumps({'base':base,'head':head,'status':'pending','patch_sha256':digest}))
          PYTHON
          python3 tools/devin-acceptance/github_snapshot.py --repository "$GITHUB_REPOSITORY" --pr "$SNAPSHOT_PR" --commit "$SNAPSHOT_HEAD" --review "$RUNNER_TEMP/pending-review.json" --output "$RUNNER_TEMP/current-check-state.json"
          rm "$RUNNER_TEMP/pending-review.json" "$RUNNER_TEMP/current-check-state.json"
      - name: Save only structural synthetic journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devin-user-journeys-synthetic-upstream
          path: |
            ${{ runner.temp }}/devin-user-journeys/client-journeys.json
            ${{ runner.temp }}/devin-user-journeys/journey-*.json
          if-no-files-found: error
          retention-days: 7

  live:
    # Never run PR code with a real credential; opt in on the default branch.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'plan' || (inputs.mode == 'live' && inputs.allow_paid)) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: devin-e2e-live
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        if: inputs.suite == 'agents' && inputs.mode != 'plan'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/devin-e2e-clients/package-lock.json
      - name: Onboard the PAT, discover models, and run the authorized mode
        env:
          DEVIN_E2E_PAT: ${{ secrets.DEVIN_E2E_PAT }}
          DEVIN_E2E_MODE_INPUT: ${{ inputs.mode }}
          DEVIN_E2E_ALLOW_PAID: ${{ inputs.allow_paid && 'true' || 'false' }}
          DEVIN_E2E_ARTIFACTS: ${{ runner.temp }}/devin-e2e
          DEVIN_E2E_SUITE_INPUT: ${{ inputs.suite }}
          DEVIN_E2E_AGENT_BATCH: ${{ inputs.agent_batch }}
        run: |
          if [ "$DEVIN_E2E_SUITE_INPUT" = agents ]; then
            if [ "$DEVIN_E2E_MODE_INPUT" != plan ]; then
              npm ci --prefix tools/devin-e2e-clients --ignore-scripts --omit=optional --no-audit --no-fund
            fi
            bash deploy/devin-agent-e2e.sh "$DEVIN_E2E_MODE_INPUT"
          else
            bash deploy/devin-e2e.sh "$DEVIN_E2E_MODE_INPUT"
          fi
      # Real-account plans, usage and session evidence remain private; do not
      # upload them as artifacts of this public repository.
